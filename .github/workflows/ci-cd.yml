
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projekt_koda

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projekt_koda/pom.xml

      - name: Build backend
        run: ./mvnw clean package -DskipTests

  test-backend:
    runs-on: ubuntu-latest
    needs: build-backend

    defaults:
      run:
        working-directory: projekt_koda

    services:
        mysql:
          image: mysql:8.0
          env:
            MYSQL_ROOT_PASSWORD: test_password_123
            MYSQL_DATABASE: ReceptiNaDlani
          ports:
            - 3306:3306
          options: >-
            --health-cmd="mysqladmin ping --silent"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=10
    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projekt_koda/pom.xml

      - name: Initialize test database
        env:
          MYSQL_PWD: test_password_123
        run: |
          mysql --host=127.0.0.1 \
                --port=3306 \
                --user=root \
                --default-character-set=utf8mb4 \
                < database/init.sql


      - name: Run backend tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/ReceptiNaDlani
          DB_USER: root
          DB_PASSWORD: test_password_123
        run: ./mvnw test

      - name: Start Spring Boot application
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/ReceptiNaDlani
          DB_USER: root
          DB_PASSWORD: test_password_123
        run: |
          nohup ./mvnw spring-boot:run > spring-boot.log 2>&1 &
          echo $! > spring-boot.pid
      

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl --silent --fail \
              http://localhost:8081/recepti > /dev/null; then
              echo "Spring Boot application is ready."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "Application failed to start."
          cat spring-boot.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman functional tests
        run: |
          mkdir -p test-results

          newman run \
            postman/ZMesalcemDoUspeha.postman_collection.json \
            --reporters cli,junit \
            --reporter-junit-export test-results/newman-results.xml

      - name: Upload Newman test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-results
          path: projekt_koda/test-results/
          if-no-files-found: ignore

      - name: Upload Spring Boot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-logs
          path: projekt_koda/spring-boot.log
          if-no-files-found: ignore
